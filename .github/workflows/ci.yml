# FR-B15: these gates pass regardless of who authored the change, including the
# project owner. A gate the author can bypass is not a control.
#
# FR-B14 made code review the security boundary, and with a team of one, review
# of the owner's own code is self-review. These checks are what stands in for
# organisational independence, so they run on every push and every pull request
# and they must be required in branch protection. Enabling that is a repository
# setting, not a file: see docs/CONTRIBUTING.md.
#
# The gates need no secrets. Schema validation does not connect to a database.

name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint, including the FR-B6 boundary rule
        run: npm run lint

      - name: Architecture and anonymity gates
        run: npm run test

      - name: Validate the database schema
        run: npm run schema:validate

  # A separate job because it needs a database. The gates above deliberately
  # need no infrastructure and no secrets, so they stay fast and can never be
  # skipped for want of a service.
  #
  # 2026-09-11: this job used to run the migrations and the isolation script and
  # nothing else, while the 23 kernel tests skipped silently in BOTH jobs. Every
  # run was green and reported "23 skipped", and nobody read that line. The tests
  # that cover the quota race, the role boundary and the FR-D15 filtering had
  # therefore never run in CI at all. `npm run gates:db` now ends with
  # `test:db`, which sets STUDENS_REQUIRE_DB=1 so an unreachable database fails
  # this job instead of quietly emptying it.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: studens
          POSTGRES_PASSWORD: studens
          POSTGRES_DB: studens
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Throwaway credentials for an ephemeral container, not a secret.
      DATABASE_URL: postgresql://studens:studens@localhost:5432/studens?schema=platform
      PGHOST: localhost
      PGUSER: studens
      PGPASSWORD: studens
      PGDATABASE: studens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y --no-install-recommends postgresql-client

      # This is the check the architecture argument rests on: a role per schema,
      # and a feature module that genuinely cannot read platform data or bypass
      # the anonymity kernel. See scripts/verify-isolation.sql.
      - name: Migrate, verify the schema isolation, then run the kernel tests
        run: npm run gates:db
